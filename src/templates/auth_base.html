<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}JobPortal{% endblock %}
    </title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/base.css') }}"
    >

    {% block extra_css %}{% endblock %}
</head>

<body>

    {% with messages = get_flashed_messages(with_categories=true) %}

        {% if messages %}
            <div
                class="global-flash-container"
                aria-live="polite"
            >
                {% for category, message in messages %}
                    <div
                        class="global-flash-message global-flash-{{ category }}"
                        role="alert"
                    >
                        <span class="flash-message-text">
                            {{ message }}
                        </span>

                        <button
                            type="button"
                            class="flash-close-button"
                            aria-label="Close message"
                        >
                            &times;
                        </button>
                    </div>
                {% endfor %}
            </div>
        {% endif %}

    {% endwith %}

    {% block content %}{% endblock %}

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            document
                .querySelectorAll(".flash-close-button")
                .forEach(function (button) {
                    button.addEventListener("click", function () {
                        const message =
                            button.closest(".global-flash-message");

                        if (message) {
                            message.remove();
                        }
                    });
                });

            window.setTimeout(function () {
                document
                    .querySelectorAll(".global-flash-message")
                    .forEach(function (message) {
                        message.classList.add("flash-hiding");

                        window.setTimeout(function () {
                            message.remove();
                        }, 300);
                    });
            }, 5000);
        });
    </script>

    {% block extra_js %}{% endblock %}
</body>
</html>
