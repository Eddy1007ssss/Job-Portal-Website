<aside class="employer-sidebar">
    <div class="employer-sidebar-container">

        <nav
            class="employer-sidebar-navigation"
            aria-label="Employer navigation"
        >
            <span class="employer-sidebar-section-title">
                Employer Menu
            </span>

            <!-- Dashboard -->
             <a
                href="{{ url_for('employer_dashboard.dashboard') }}"
                class="employer-sidebar-link {{
                    'active'
                    if request.endpoint == 'employer_dashboard.dashboard'
                    else ''
                }}"
            >
                <span class="sidebar-link-icon">
                    <i class="fa-solid fa-table-columns"></i>
                </span>

                <span>Dashboard</span>
            </a>


            <!-- Company profile -->
            <a
                href="{{ url_for('employer.company_preview') }}"
                class="
                    employer-sidebar-link
                    {% if request.endpoint in [
                        'employer.company_preview',
                        'employer.company_profile'
                    ] %}
                        active
                    {% endif %}
                "
            >
                <span class="employer-sidebar-icon">
                    <i class="fa-regular fa-building"></i>
                </span>

                <span class="employer-sidebar-link-text">
                    Company Profile
                </span>
            </a>


           <!-- Job Listings -->
<a
    href="{{ url_for('jobs.employer_jobs') }}"
    class="
        employer-sidebar-link
        {% if request.endpoint in [
            'jobs.employer_jobs',
            'jobs.edit_job'
        ] %}
            active
        {% endif %}
    "
>
    <span class="employer-sidebar-icon">
        <i class="fa-solid fa-briefcase"></i>
    </span>

    <span class="employer-sidebar-link-text">
        Job Listings
    </span>
</a>

<!-- Post Job -->
<a
    href="{{ url_for('jobs.post_job') }}"
    class="
        employer-sidebar-link
        {% if request.endpoint == 'jobs.post_job' %}
            active
        {% endif %}
    "
>
    <span class="employer-sidebar-icon">
        <i class="fa-solid fa-circle-plus"></i>
    </span>

    <span class="employer-sidebar-link-text">
        Post Job
    </span>
</a>

            <!-- Interviews -->
            <a
                href="{{ url_for('interviews.employer_interviews') }}"
                class="employer-sidebar-link {{
                    'active'
                    if request.endpoint in [
                        'interviews.employer_interviews',
                        'interviews.manage_interview'
                    ]
                    else ''
                }}"
            >
                <span class="employer-sidebar-icon">
                    <i class="fa-regular fa-calendar"></i>
                </span>

                <span class="employer-sidebar-link-text">
                    Interviews
                </span>
            </a>


            <!-- Notifications -->
            <a
                href="{{ url_for('employer_notifications.notification_list') }}"
                class="employer-sidebar-link {{
                    'active'
                    if request.endpoint and
                       request.endpoint.startswith('employer_notifications.')
                    else ''
                }}"
            >
                <span class="employer-sidebar-icon">
                    <i class="fa-regular fa-bell"></i>
                </span>

                <span class="employer-sidebar-link-text">
                    Notifications
                </span>

                {% if employer_notification_count %}
                    <span class="employer-sidebar-notification-badge">
                        {{ employer_notification_count if employer_notification_count < 100 else '99+' }}
                    </span>
                {% endif %}
            </a>

        </nav>


        <!-- Sidebar footer -->
        <div class="employer-sidebar-footer">

            <a
                href="{{ url_for('employer.logout') }}"
                class="employer-sidebar-logout"
            >
                <span class="employer-sidebar-icon">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i>
                </span>

                <span class="employer-sidebar-link-text">
                    Logout
                </span>
            </a>

        </div>

    </div>
</aside>
