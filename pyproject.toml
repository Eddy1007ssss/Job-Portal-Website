[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agile-demo"
version = "0.1.0"
description = "Job Portal Website"
requires-python = ">=3.14"

dependencies = [
    "flask>=3.1,<4.0",
    "gunicorn>=23.0,<24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "black>=25.0",
    "ruff>=0.9",
    "mypy>=1.14",
]

[tool.black]
target-version = ["py314"]
line-length = 88

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]